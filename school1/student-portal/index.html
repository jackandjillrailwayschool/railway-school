<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — Jack & Jill EM High School</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --navy: #0a1628;
            --gold: #c8a84b;
            --white: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --radius: 20px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* 🔥 UPDATED: Removed blue glare, used neutral dark overlay for readability 🔥 */
            background: 
                linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.6)),
                url("student.jpg") center/cover no-repeat fixed;
        }

        /* ── HEADER ── */
        header {
            background: rgba(10, 22, 40, 0.7); /* More transparent */
            backdrop-filter: blur(8px);
            padding: 20px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 { 
            font-family: 'Playfair Display', serif; 
            color: var(--white); 
            font-size: clamp(24px, 4vw, 38px);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        header p { 
            color: var(--gold); 
            font-size: 12px; 
            text-transform: uppercase; 
            letter-spacing: 3px;
            margin-top: 5px;
            font-weight: 600;
        }

        /* ── LOGOS ── */
        .logo {
            position: absolute; top: 20px; width: 100px; height: 100px;
            border-radius: 50%; border: 3px solid var(--gold);
            background: white; object-fit: contain; padding: 5px;
        }
        .logo-left { left: 40px; }
        .logo-right { right: 40px; }

        /* ── MAIN CONTENT ── */
        main {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background: var(--white);
            width: 100%; max-width: 420px;
            border-radius: var(--radius);
            padding: 50px 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: #f1f5f9; color: var(--navy);
            padding: 6px 16px; border-radius: 30px; font-size: 11px;
            font-weight: 700; text-transform: uppercase; margin-bottom: 20px;
        }

        .card-head h2 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--navy); margin-bottom: 8px; }
        .card-head p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 30px; }

        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 11px; font-weight: 700; color: var(--navy); text-transform: uppercase; margin-bottom: 8px; }
        
        .input-wrap input {
            width: 100%; padding: 14px 16px; border: 1.5px solid #e2e8f0;
            border-radius: 12px; font-size: 15px; font-family: inherit;
            background: #fcfdfe; outline: none; transition: all 0.2s;
        }

        .input-wrap input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(200, 168, 75, 0.1); }

        .btn-main {
            width: 100%; padding: 16px; background: var(--navy); color: var(--gold);
            border: none; border-radius: 12px; font-size: 16px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; margin-top: 10px;
        }
        .btn-main:hover { background: #142040; transform: translateY(-1px); }

        .footer-link { text-align: center; margin-top: 30px; font-size: 13px; }
        .footer-link a { color: var(--navy); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--gold); }

        @media (max-width: 900px) { .logo { display: none; } }
    </style>
</head>
<body>

    <header>
        <img src="jack2.jpeg" class="logo logo-left" alt="Indian Railways">
        <img src="jack1.jpeg" class="logo logo-right" alt="School Logo">
        <h1>JACK & JILL EM HIGH SCHOOL</h1>
        <p>South Coast Railway · Vijayawada</p>
    </header>

    <main>
        <div class="login-card">
            <div class="badge">🎓 Student Portal</div>
            <div class="card-head">
                <h2>Student Login</h2>
                <p>Sign in with your Admission Number to view your marks and attendance.</p>
            </div>

            <div id="errorMsg" style="display:none; color:red; font-size:13px; margin-bottom:15px; text-align:center;"></div>

            <div class="field">
                <label>Admission Number</label>
                <div class="input-wrap"><input type="text" id="admissionNo" placeholder="e.g. 1001"></div>
            </div>

            <div class="field">
                <label>Password</label>
                <div class="input-wrap"><input type="password" id="password" placeholder="••••••••"></div>
            </div>

            <button class="btn-main" onclick="doLogin()">Sign In to Portal</button>

            <div class="footer-link">
                Are you staff? <a href="https://jack-and-jill-school.onrender.com">Go to Staff Portal →</a>
            </div>
        </div>
    </main>

    <script>
        const API = 'https://jack-and-jill-school.onrender.com';

        async function doLogin() {
            const adm = document.getElementById('admissionNo').value.trim();
            const pwd = document.getElementById('password').value.trim();
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';

            if (!adm || !pwd) { err.innerText = 'Fill all fields'; err.style.display = 'block'; return; }

            try {
                const res = await fetch(`${API}/api/auth/student-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admissionNo: parseInt(adm), password: pwd })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentInfo', JSON.stringify(data.student));
                    window.location.href = 'dashboard.html';
                } else {
                    err.innerText = data.message || 'Login failed';
                    err.style.display = 'block';
                }
            } catch (e) {
                err.innerText = 'Server error. Try again.';
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
