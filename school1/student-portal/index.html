<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Student Login</title>
    <style>
        body { font-family: sans-serif; background: #0a1628; display: flex; justify-content: center; align-items: center; height: 100vh; color: white; }
        .card { background: white; color: #333; padding: 40px; border-radius: 12px; width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #0a1628; color: #c8a84b; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .error-msg { display: none; color: red; font-size: 13px; margin-bottom: 10px; }
        .error-msg.show { display: block; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-bottom: 20px;">Student Portal</h2>
        <div id="errorMsg" class="error-msg"></div>
        <input type="text" id="admissionNo" placeholder="Admission Number">
        <input type="password" id="password" placeholder="Password">
        <button id="loginBtn" onclick="doLogin()">Sign In</button>
        <p style="font-size: 12px; margin-top: 20px;">Staff? <a href="https://jack-and-jill-school.onrender.com">Go here</a></p>
    </div>

    <script>
        const API = 'https://jack-and-jill-school.onrender.com';

        // 1. Define these FIRST so they never fail
        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.classList.add('show');
        }
        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }

        async function doLogin() {
            hideError();
            const adm = document.getElementById('admissionNo').value;
            const pwd = document.getElementById('password').value;

            if(!adm || !pwd) return showError("Enter both fields.");

            const btn = document.getElementById('loginBtn');
            btn.innerText = "Checking...";
            btn.disabled = true;

            try {
                const res = await fetch(API + '/api/auth/student-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admissionNo: parseInt(adm), password: pwd })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentInfo', JSON.stringify(data.student));
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.message || "Login failed");
                }
            } catch (e) {
                showError("Could not connect to server. Try again in 10s.");
            } finally {
                btn.innerText = "Sign In";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
