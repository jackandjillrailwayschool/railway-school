<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — Jack & Jill EM High School</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --navy: #0a1628;
            --navy-light: #142040;
            --gold: #c8a84b;
            --gold-bright: #e6c96e;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text: #1e293b;
            --muted: #64748b;
            --error: #dc2626;
            --radius: 16px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--navy);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
        }

        /* ── HEADER ── */
        header {
            background: rgba(10, 22, 40, 0.8);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(200, 168, 75, 0.2);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--gold);
            object-fit: cover;
            background: white;
        }

        .header-text h1 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: clamp(16px, 2vw, 20px);
            letter-spacing: 0.5px;
        }

        .header-text p {
            color: rgba(255,255,255,0.5);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── MAIN CONTENT ── */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 20px 40px;
            background: 
                radial-gradient(circle at 10% 20%, rgba(200, 168, 75, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(200, 168, 75, 0.05) 0%, transparent 40%),
                var(--navy);
        }

        .login-card {
            background: var(--white);
            width: 100%;
            max-width: 440px;
            border-radius: var(--radius);
            padding: 50px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--gold), var(--gold-bright), var(--gold));
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(200, 168, 75, 0.1);
            color: var(--navy);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 24px;
            border: 1px solid rgba(200, 168, 75, 0.3);
        }

        .card-head h2 {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            color: var(--navy);
            margin-bottom: 10px;
        }

        .card-head p {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 32px;
        }

        /* ── FORM FIELDS ── */
        .field { margin-bottom: 20px; }
        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--navy);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .input-wrap { position: relative; }
        .input-wrap input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: all 0.2s;
            outline: none;
            background: var(--off-white);
        }

        .input-wrap input:focus {
            border-color: var(--gold);
            background: white;
            box-shadow: 0 0 0 4px rgba(200, 168, 75, 0.1);
        }

        .toggle-pw {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--muted);
            font-size: 18px;
        }

        /* ── BUTTON ── */
        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--navy);
            color: var(--gold);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: var(--navy-light);
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .btn-login:active { transform: translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── MESSAGES ── */
        .msg {
            display: none;
            font-size: 13px;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }
        .msg.error { background: #fef2f2; border: 1px solid #fecaca; color: var(--error); }
        .msg.show { display: block; }

        .footer-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: var(--muted);
        }
        .footer-link a {
            color: var(--navy);
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1.5px solid var(--gold);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        @media (max-width: 480px) {
            .login-card { padding: 35px 25px; }
            header { padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="https://jack-and-jill-school.onrender.com/jack1.jpeg" class="header-logo" alt="Logo">
        <div class="header-text">
            <h1>JACK & JILL EM HIGH SCHOOL</h1>
            <p>Student Administration System</p>
        </div>
    </header>

    <main>
        <div class="login-card">
            <div class="badge">🎓 Student Portal</div>
            
            <div class="card-head">
                <h2>Welcome Back</h2>
                <p>Enter your credentials to access your academic reports, marks, and attendance.</p>
            </div>

            <div id="errorMsg" class="msg error"></div>

            <div class="field">
                <label>Admission Number</label>
                <div class="input-wrap">
                    <input type="text" id="admissionNo" placeholder="e.g. 1001">
                </div>
            </div>

            <div class="field">
                <label>Your Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="••••••••">
                    <button class="toggle-pw" onclick="togglePw()" type="button">👁</button>
                </div>
            </div>

            <button class="btn-login" id="loginBtn" onclick="doLogin()">Sign In to Portal</button>

            <div class="footer-link">
                Are you staff? <a href="https://jack-and-jill-school.onrender.com">Go to Staff Portal →</a>
            </div>
        </div>
    </main>

    <footer>© 2026 Jack & Jill EM High School · South Coast Railway Womens Welfare Organization</footer>

    <script>
        const API = 'https://jack-and-jill-school.onrender.com';

        function togglePw() {
            const p = document.getElementById('password');
            p.type = p.type === 'password' ? 'text' : 'password';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.classList.add('show');
        }

        function hideError() {
            document.getElementById('errorMsg').classList.remove('show');
        }

        async function doLogin() {
            hideError();
            const adm = document.getElementById('admissionNo').value.trim();
            const pwd = document.getElementById('password').value.trim();

            if (!adm || !pwd) return showError('Please enter both fields.');

            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API}/api/auth/student-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admissionNo: parseInt(adm), password: pwd })
                });
                
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentInfo', JSON.stringify(data.student));
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.message || 'Login failed. Please check credentials.');
                }
            } catch (err) {
                showError('Server is waking up. Please try again in a few seconds.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        // Enter key to login
        document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
