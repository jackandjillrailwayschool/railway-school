<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — Jack & Jill EM High School</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --navy: #0a1628;
            --navy-deep: #050b1a;
            --gold: #c8a84b; /* Primary School Gold */
            --gold-hover: #dfc06b;
            --white: #ffffff;
            --off-white: #f8fafc;
            --text: #1e293b;
            --muted: #64748b;
            --error: #dc2626;
            --radius: 20px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Darker background to make the gold button pop */
            background: 
                linear-gradient(rgba(5, 11, 26, 0.8), rgba(5, 11, 26, 0.9)),
                url("student.jpg") center/cover no-repeat fixed;
        }

        /* ── HEADER ── */
        header {
            background: rgba(10, 22, 40, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 1px solid rgba(200, 168, 75, 0.3);
            position: fixed;
            width: 100%; top: 0; z-index: 100;
        }

        .header-logo {
            width: 50px; height: 50px; border-radius: 50%;
            border: 2px solid var(--gold); object-fit: cover; background: white;
        }

        .header-text h1 { font-family: 'Playfair Display', serif; color: var(--gold); font-size: 20px; }
        .header-text p { color: rgba(255,255,255,0.6); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }

        /* ── MAIN CONTENT ── */
        main {
            flex: 1;
            display: flex; align-items: center; justify-content: center;
            padding: 120px 20px 60px;
        }

        .login-card {
            background: var(--white);
            width: 100%; max-width: 420px;
            border-radius: var(--radius);
            padding: 50px 40px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        /* Top Gold Accent Line */
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 6px;
            background: var(--gold); border-radius: var(--radius) var(--radius) 0 0;
        }

        .badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(200, 168, 75, 0.15); color: #856a1b;
            padding: 6px 16px; border-radius: 30px; font-size: 11px;
            font-weight: 700; text-transform: uppercase; margin-bottom: 24px;
        }

        .card-head h2 { font-family: 'Playfair Display', serif; font-size: 32px; color: var(--navy); margin-bottom: 8px; }
        .card-head p { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 30px; }

        /* ── FORM ── */
        .field { margin-bottom: 20px; }
        .field label { display: block; font-size: 11px; font-weight: 700; color: var(--navy); text-transform: uppercase; margin-bottom: 8px; }
        
        .input-wrap input {
            width: 100%; padding: 14px 16px; border: 1.5px solid #e2e8f0;
            border-radius: 12px; font-size: 15px; font-family: inherit;
            background: #fcfdfe; outline: none; transition: all 0.2s;
        }

        .input-wrap input:focus {
            border-color: var(--gold);
            background: white;
            box-shadow: 0 0 0 4px rgba(200, 168, 75, 0.1);
        }

        /* ── GOLD BUTTON ── */
        .btn-main {
            width: 100%; padding: 16px;
            background: var(--gold); /* Switched to Gold background */
            color: var(--navy);      /* Dark text on light button */
            border: none; border-radius: 12px;
            font-size: 16px; font-weight: 800;
            cursor: pointer; transition: all 0.3s ease;
            margin-top: 10px; letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .btn-main:hover {
            background: var(--gold-hover);
            transform: translateY(-2px);
            box-shadow: 0 12px 20px rgba(200, 168, 75, 0.3);
        }

        .btn-main:active { transform: translateY(0); }
        .btn-main:disabled { background: #d1d5db; color: #9ca3af; cursor: not-allowed; }

        /* ── MESSAGES ── */
        .msg { display: none; font-size: 13px; padding: 12px; border-radius: 8px; margin-bottom: 20px; text-align: center; font-weight: 600; }
        .msg.error { display: block; background: #fff1f2; border: 1px solid #fecdd3; color: var(--error); }

        .footer-link { text-align: center; margin-top: 30px; font-size: 13px; color: var(--muted); }
        .footer-link a { color: var(--navy); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--gold); padding-bottom: 2px; }

        footer { text-align: center; padding: 30px; color: rgba(255,255,255,0.4); font-size: 11px; margin-top: auto; }

        @media (max-width: 480px) {
            header { padding: 10px 20px; }
            .login-card { padding: 40px 25px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="../jack1.jpeg" class="header-logo" alt="Logo">
        <div class="header-text">
            <h1>JACK & JILL EM HIGH SCHOOL</h1>
            <p>Student Portal</p>
        </div>
    </header>

    <main>
        <div class="login-card">
            <div class="badge">🎓 Academic Access</div>
            
            <div class="card-head">
                <h2>Student Login</h2>
                <p>Access your marks, attendance, and fee details from the cloud database.</p>
            </div>

            <div id="errorMsg" class="msg error"></div>

            <div class="field">
                <label>Admission Number</label>
                <div class="input-wrap">
                    <input type="text" id="admissionNo" placeholder="e.g. 1001" inputmode="numeric">
                </div>
            </div>

            <div class="field">
                <label>Your Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" placeholder="••••••••">
                </div>
            </div>

            <button class="btn-main" id="loginBtn" onclick="doLogin()">Log In to Portal</button>

            <div class="footer-link">
                Are you a staff member? <a href="https://jack-and-jill-school.onrender.com">Sign In here →</a>
            </div>
        </div>
    </main>

    <footer>© 2026 Jack & Jill EM High School · South Coast Railway Womens Welfare Organization</footer>

    <script>
        const API = 'https://jack-and-jill-school.onrender.com';

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.innerText = msg;
            el.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMsg').style.display = 'none';
        }

        async function doLogin() {
            hideError();
            const adm = document.getElementById('admissionNo').value.trim();
            const pwd = document.getElementById('password').value.trim();

            if (!adm || !pwd) return showError('Missing credentials.');

            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Verifying...';
            btn.disabled = true;

            try {
                const res = await fetch(`${API}/api/auth/student-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admissionNo: parseInt(adm), password: pwd })
                });
                
                const data = await res.json();

                if (res.ok) {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentInfo', JSON.stringify(data.student));
                    window.location.href = 'dashboard.html';
                } else {
                    showError(data.message || 'Login failed.');
                }
            } catch (err) {
                showError('Connection timeout. Please retry in 5 seconds.');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
        document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    </script>
</body>
</html>
