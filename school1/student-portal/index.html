<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — Jack & Jill EM High School</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root { --navy: #0a1628; --gold: #c8a84b; --white: #ffffff; --text: #1e293b; --muted: #64748b; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            /* 🔥 NO BLUE GLARE: Using neutral black overlay 🔥 */
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.7)), url("../student.jpg") center/cover no-repeat fixed;
        }

        /* ── FLOATING HEADER ── */
        header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            position: fixed;
            width: 85%; max-width: 1000px;
            /* 🔥 PUSHED DOWN BY 50PX 🔥 */
            top: 50px;
            left: 50%; transform: translateX(-50%);
            z-index: 100; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
        }

        header h1 { font-family: 'Playfair Display', serif; color: #fff; font-size: clamp(20px, 4vw, 32px); text-transform: uppercase; }
        header p { color: var(--gold); font-size: 11px; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; margin-top: 5px; }

        /* ── LOGOS ── */
        .logo { position: absolute; top: 50%; transform: translateY(-50%); width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--gold); background: white; object-fit: contain; }
        .logo-left { left: -40px; }
        .logo-right { right: -40px; }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 180px 20px 40px; }

        /* ── MINI LOGIN BOX ── */
        .login-card {
            background: #fff;
            /* 🔥 DRASTICALLY REDUCED WIDTH 🔥 */
            width: 100%; max-width: 340px;
            border-radius: 16px; padding: 40px 25px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
            position: relative;
        }
        .login-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px; background: var(--gold); border-radius: 16px 16px 0 0; }

        .badge { display: inline-flex; align-items: center; gap: 6px; background: #f1f5f9; color: var(--navy); padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 700; margin-bottom: 15px; text-transform: uppercase; }
        .card-head h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--navy); margin-bottom: 6px; }
        .card-head p { font-size: 13px; color: var(--muted); margin-bottom: 25px; line-height: 1.4; }

        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 10px; font-weight: 700; color: var(--navy); text-transform: uppercase; margin-bottom: 6px; }
        .input-wrap input { width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 14px; background: #fcfdfe; outline: none; transition: 0.2s; }
        .input-wrap input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(200, 168, 75, 0.1); }

        .btn-main { width: 100%; padding: 14px; background: var(--navy); color: var(--gold); border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; text-transform: uppercase; margin-top: 5px; }
        .btn-main:hover { background: #1a2a4d; transform: translateY(-1px); }

        .footer-link { text-align: center; margin-top: 25px; font-size: 12px; color: var(--muted); }
        .footer-link a { color: var(--navy); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--gold); }
        
        @media (max-width: 900px) { .logo { display: none; } header { width: 95%; top: 20px; } }
    </style>
</head>
<body>
    <header>
        <img src="../jack2.jpeg" class="logo logo-left" alt="Railways">
        <img src="../jack1.jpeg" class="logo logo-right" alt="School">
        <h1>JACK & JILL EM HIGH SCHOOL</h1>
        <p>Student Portal System</p>
    </header>

    <main>
        <div class="login-card">
            <div class="badge">🎓 Secure Login</div>
            <div class="card-head">
                <h2>Student Portal</h2>
                <p>Access your marks, reports, and fees from the cloud.</p>
            </div>
            <div id="errorMsg" style="display:none; color:red; font-size:12px; margin-bottom:12px; text-align:center;"></div>
            <div class="field">
                <label>Admission No.</label>
                <div class="input-wrap"><input type="text" id="admissionNo" placeholder="Enter number"></div>
            </div>
            <div class="field">
                <label>Password</label>
                <div class="input-wrap"><input type="password" id="password" placeholder="••••••••"></div>
            </div>
            <button class="btn-main" onclick="doLogin()">Sign In</button>
            <div class="footer-link">Are you staff? <a href="https://jack-and-jill-school.onrender.com">Go to Staff Portal</a></div>
        </div>
    </main>

    <script>
        const API = 'https://jack-and-jill-school.onrender.com';
        async function doLogin() {
            const adm = document.getElementById('admissionNo').value.trim();
            const pwd = document.getElementById('password').value.trim();
            const err = document.getElementById('errorMsg');
            if (!adm || !pwd) { err.innerText = 'Fields cannot be empty'; err.style.display = 'block'; return; }
            try {
                const res = await fetch(`${API}/api/auth/student-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admissionNo: parseInt(adm), password: pwd })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentInfo', JSON.stringify(data.student));
                    window.location.href = 'dashboard.html';
                } else {
                    err.innerText = data.message || 'Login failed';
                    err.style.display = 'block';
                }
            } catch (e) { err.innerText = 'Server error. Try again.'; err.style.display = 'block'; }
        }
    </script>
</body>
</html>
