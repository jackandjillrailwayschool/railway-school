<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal — Jack & Jill EM High School</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --navy: #0a1628;
            --gold: #c8a84b;
            --white: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --radius: 16px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: 
                linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.7)),
                url("student.jpg") center/cover no-repeat fixed;
        }

        /* ── FLOATING HEADER ── */
        header {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(12px);
            padding: 15px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: fixed;
            width: 90%;
            max-width: 1100px;
            /* 🔥 Pulled down from the top 🔥 */
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            border-radius: 15px;
        }

        header h1 { 
            font-family: 'Playfair Display', serif; 
            color: var(--white); 
            font-size: clamp(18px, 3vw, 28px);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header p { 
            color: var(--gold); 
            font-size: 10px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-top: 4px;
            font-weight: 700;
        }

        /* ── LOGOS (Adjusted for Floating Header) ── */
        .logo {
            position: absolute; 
            top: 50%;
            transform: translateY(-50%);
            width: 70px; 
            height: 70px;
            border-radius: 50%; 
            border: 2px solid var(--gold);
            background: white; 
            object-fit: contain; 
            padding: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .logo-left { left: -35px; } /* Peek out from the side */
        .logo-right { right: -35px; }

        /* ── MAIN CONTENT ── */
        main {
            flex: 1;
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 160px 20px 40px; /* Space for the floating header */
        }

        /* ── COMPACT LOGIN BOX ── */
        .login-card {
            background: var(--white);
            /* 🔥 Reduced size from 420px to 360px 🔥 */
            width: 100%; 
            max-width: 360px;
            border-radius: var(--radius);
            /* 🔥 Reduced padding 🔥 */
            padding: 40px 30px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
            background: var(--gold); border-radius: var(--radius) var(--radius) 0 0;
        }

        .badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: #f1f5f9; color: var(--navy);
            padding: 4px 12px; border-radius: 30px; font-size: 10px;
            font-weight: 700; text-transform: uppercase; margin-bottom: 15px;
        }

        .card-head h2 { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--navy); margin-bottom: 6px; }
        .card-head p { font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 25px; }

        .field { margin-bottom: 15px; }
        .field label { display: block; font-size: 10px; font-weight: 700; color: var(--navy); text-transform: uppercase; margin-bottom: 6px; }
        
        .input-wrap input {
            width: 100%; padding: 12px 14px; border: 1.5px solid #e2e8f0;
            border-radius: 8px; font-size: 14px; font-family: inherit;
            background: #fcfdfe; outline: none; transition: all 0.2s;
        }
        .input-wrap input:focus { border-color: var(--gold); box-shadow: 0 0 0 4px rgba(200, 168, 75, 0.1); }

        .btn-main {
            width: 100%; padding: 14px; background: var(--navy); color: var(--gold);
            border: none; border-radius: 10px; font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; margin-top: 10px; text-transform: uppercase;
        }
        .btn-main:hover { background: #1a2a4d; transform: translateY(-1px); }

        .footer-link { text-align: center; margin-top: 25px; font-size: 12px; color: var(--muted); }
        .footer-link a { color: var(--navy); font-weight: 700; text-decoration: none; border-bottom: 1.5px solid var(--gold); }

        footer { text-align: center; padding: 20px; color: rgba(255,255,255,0.4); font-size: 10px; }

        @media (max-width: 900px) { 
            .logo { display: none; } 
            header { width: 95%; top: 15px; }
            main { padding-top: 140px; }
        }
    </style>
</head>
<body>

    <header>
        <img src="../jack2.jpeg" class="logo logo-left" alt="Indian Railways">
        <img src="../jack1.jpeg" class="logo logo-right" alt="School Logo">
        <h1>JACK & JILL EM HIGH SCHOOL</h1>
        <p>Student Portal System</p>
    </header>

    <main>
        <div class="login-card">
            <div class="badge">🎓 Secure Login</div>
            <div class="card-head">
                <h2>Student Sign In</h2>
                <p>Enter your details to view your academic reports and fees.</p>
            </div>

            <div id="errorMsg" style="display:none; color:red; font-size:12px; margin-bottom:12px; text-align:center; font-weight:600;"></div>

            <div class="field">
                <label>Admission Number</label>
                <div class="input-wrap"><input type="text" id="admissionNo" placeholder="Enter Adm No."></div>
            </div>

            <div class="field">
                <label>Password</label>
                <div class="input-wrap"><input type="password" id="password" placeholder="••••••••"></div>
            </div>

            <button class="btn-main" onclick="doLogin()">Log In to Portal</button>

            <div class="footer-link">
                Are you staff? <a href="https://jack-and-jill-school.onrender.com">Sign In here →</a>
            </div>
        </div>
    </main>

    <footer>© 2026 Jack & Jill EM High School</footer>

    <script>
        const API = 'https://jack-and-jill-school.onrender.com';

        async function doLogin() {
            const adm = document.getElementById('admissionNo').value.trim();
            const pwd = document.getElementById('password').value.trim();
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';

            if (!adm || !pwd) { err.innerText = 'Fields cannot be empty'; err.style.display = 'block'; return; }

            try {
                const res = await fetch(`${API}/api/auth/student-login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ admissionNo: parseInt(adm), password: pwd })
                });
                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('studentToken', data.token);
                    localStorage.setItem('studentInfo', JSON.stringify(data.student));
                    window.location.href = 'dashboard.html';
                } else {
                    err.innerText = data.message || 'Login failed';
                    err.style.display = 'block';
                }
            } catch (e) {
                err.innerText = 'Server connecting... try again';
                err.style.display = 'block';
            }
        }
    </script>
</body>
</html>
